services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_ai
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgress
      - POSTGRES_DB=ai_assistant
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    container_name: openwebui
    environment:
      - DATABASE_URL=postgresql://postgres:postgress@postgres:5432/ai_assistant
      - OPENAI_API_BASE_URLS=http://ollama:11434/v1
      - OPENAI_API_KEYS=anything
      - ENABLE_OPENAI_API=true
      - ENABLE_EXTERNAL_TOOLS=true
      - EXTERNAL_TOOLS_URL=http://mcpo:8081
      - HF_HUB_OFFLINE=1
      - AIOHTTP_CLIENT_SESSION_SSL=False
    volumes:
      - ./openwebui_data:/app/backend/data
    restart: always
    networks:
      - app
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      mcpo:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts/preload-model.sh:/usr/local/bin/preload-model.sh:ro
    env_file:
      - .env
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:14b-instruct}
      - OLLAMA_KEEP_ALIVE=-1
    entrypoint: ["/bin/bash", "/usr/local/bin/preload-model.sh"]
    restart: always
    networks:
      - app
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  mcp-server-journal:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp_server:latest
    command: ["uv", "run", "-m", "app.journal_server.main", "--host", "0.0.0.0", "--port", "8003", "--path", "/journal"]
    expose: ["8003"]
    ports: ["8003:8003"]
    restart: unless-stopped
    networks: [app]
    env_file:
      - .env
    environment:
      - MCP_SERVER_BASE_URL=http://localhost:8003
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://0.0.0.0:8003/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  mcp-server-analytics:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp_server:latest
    command: ["uv", "run", "-m", "app.analytics_server.main", "--host", "0.0.0.0", "--port", "8004", "--path", "/analytics"]
    expose: ["8004"]
    ports: ["8004:8004"]
    restart: unless-stopped
    networks: [app]
    env_file:
      - .env
    volumes:
      - ./analytics_charts:/app/analytics_charts
    environment:
      - ANALYTICS_CHARTS_DIR=/app/analytics_charts
      - MCP_SERVER_BASE_URL=http://localhost:8004
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://0.0.0.0:8004/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  mcp-server-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp_server:latest
    command: ["uv", "run", "-m", "app.scheduler_server.main", "--host", "0.0.0.0", "--port", "8005", "--path", "/scheduler"]
    expose: ["8005"]
    ports: ["8005:8005"]
    restart: unless-stopped
    networks: [app]
    env_file:
      - .env
    environment:
      - MCP_SERVER_BASE_URL=http://localhost:8005
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://0.0.0.0:8005/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  mcpo:
    image: ghcr.io/open-webui/mcpo:latest
    depends_on:
      mcp-server-journal:
        condition: service_healthy
      mcp-server-analytics:
        condition: service_healthy
      mcp-server-scheduler:
        condition: service_healthy
    volumes:
      - ./mcpo.config.json:/app/mcpo.config.json:ro
    command: ["mcpo", "mcpo", "--host", "0.0.0.0", "--port", "8081", "--config", "/app/mcpo.config.json"]
    ports: ["8100:8081"]
    restart: unless-stopped
    networks: [app]

networks:
  app: {}

volumes:
  postgres_data:
  ollama_data:
  openwebui_data:
  analytics_charts:
