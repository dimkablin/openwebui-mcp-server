model_list:
  # BGE-M3 Embedding Model (multilingual, 1024 dimensions)
  - model_name: bge-m3
    litellm_params:
      model: ollama/bge-m3
      api_base: http://ollama:11434

  # Можно добавить другие модели эмбеддингов
  - model_name: nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434

# Настройки LiteLLM
litellm_settings:
  drop_params: true
  set_verbose: true

# Логирование
general_settings:
  master_key: sk-litellm-master-key
  database_url: null  # Можно добавить postgres для логов
